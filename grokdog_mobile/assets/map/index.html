<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GrokPatrol map</title>
<style>
  /* stessi colori di grokdog/src/app/globals.css */
  :root { --app:#121212; --line:#2a2a2a; --ink:#f5f5f5; --muted:#a8a8a8; --faint:#707070; --accent:#e99a3c; --ok:#34d399; --red:#f87171; }
  html, body { position:fixed; inset:0; margin:0; overflow:hidden; background:var(--app); overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font:12px/1.3 -apple-system, BlinkMacSystemFont, "Roboto", system-ui, sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; overflow:hidden; touch-action:none; }
  canvas { display:block; touch-action:none; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", monospace; font-variant-numeric:tabular-nums; }
  .lbl-room  { color:var(--faint); white-space:nowrap; }
  .lbl-point { color:var(--muted); }
  .lbl-spot { pointer-events:auto; padding:2px 5px; border:1px solid var(--line); border-radius:6px; background:rgba(18,18,18,.75); color:var(--muted); font:inherit; }
  .lbl-btn, .lbl-dog { pointer-events:auto; display:flex; align-items:center; gap:5px; padding:3px 7px; border:1px solid var(--line);
    border-radius:7px; background:rgba(18,18,18,.88); color:var(--ink); font:inherit; white-space:nowrap; }
  .lbl-btn svg { width:12px; height:12px; }
  .lbl-dog { gap:7px; background:rgba(18,18,18,.8); }
  .lbl-event { display:flex; align-items:center; gap:5px; padding:2px 6px; border:1px solid; border-radius:6px; background:rgba(18,18,18,.9); white-space:nowrap; }
  .lbl-route { display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--app); font-weight:600; }
  .batt { display:flex; align-items:center; gap:4px; color:var(--ok); }
  .batt.mid { color:var(--accent); }
  .batt.low { color:var(--red); }
  .batt .cell { position:relative; display:block; box-sizing:border-box; width:18px; height:9px; padding:1px; border:1px solid currentColor; border-radius:3px; }
  .batt .cell i { display:block; height:100%; border-radius:1px; background:currentColor; }
  .batt .cell::after { content:""; position:absolute; right:-3px; top:50%; width:2px; height:4px; transform:translateY(-50%); border-radius:0 1px 1px 0; background:currentColor; }
</style>
</head>
<body>
<div id="map"></div>
<script src="scene.js"></script>
</body>
</html>
